name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 11, 17, 21, 25 ]

    steps:
    - uses: actions/checkout@v4
    - name: Setup java
      uses: actions/setup-java@v5
      with:
        distribution: corretto
        java-version: ${{ matrix.java }}

    - name: Build with Maven
      run: mvn -B package --file pom.xml
